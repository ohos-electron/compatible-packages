<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electron 兼容 JS 库查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:40px 20px}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:28px;color:#1a1a2e;margin-bottom:8px}
.header p{color:#666;font-size:14px}
.disclaimer{font-size:13px;color:#e65100;background:#fff3e0;padding:8px 12px;border-radius:6px;margin-top:12px;line-height:1.6}
.disclaimer a{color:#e65100;font-weight:600}
.stats-bar{display:flex;justify-content:center;gap:16px;margin-bottom:24px;flex-wrap:wrap;max-width:600px;margin-left:auto;margin-right:auto}
.stat-card{background:#fff;border-radius:8px;padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center;min-width:100px}
.stat-card .num{font-size:22px;font-weight:700;color:#4f46e5}
.stat-card .label{font-size:11px;color:#999;margin-top:4px}
.search-box{position:relative;margin-bottom:24px;max-width:600px;margin-left:auto;margin-right:auto}
.search-box input{width:100%;padding:14px 16px 14px 44px;font-size:16px;border:2px solid #e0e0e0;border-radius:8px;outline:none;background:#fff}
.search-box input:focus{border-color:#4f46e5}
.search-box .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#999}
.search-box .loading{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;color:#999;display:none}
.search-box .loading.show{display:block}
.result-info{margin-bottom:12px;font-size:13px;color:#888}
.result-table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:0 auto}
.result-table th{background:#f8f9fb;padding:12px 16px;text-align:left;font-size:13px;font-weight:600;color:#555;border-bottom:1px solid #eee;position:sticky;top:0}
.result-table td{padding:10px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;word-break:break-all}
.result-table tr:hover{background:#fafbfc}
.pkg-name{font-family:monospace;color:#1a1a2e;font-weight:500}
.pkg-name a{color:inherit;text-decoration:none}
.pkg-name a:hover{color:#4f46e5;text-decoration:underline}
.pkg-version{font-family:monospace;color:#059669}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;background:#d1fae5;color:#065f46;white-space:nowrap}
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}
.pagination button{padding:6px 14px;border:1px solid #e0e0e0;border-radius:4px;background:#fff;cursor:pointer;font-size:14px;color:#555}
.pagination button:hover:not(:disabled){background:#4f46e5;color:#fff;border-color:#4f46e5}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.pagination .page-info{font-size:13px;color:#888}
.footer{text-align:center;margin-top:32px;font-size:12px;color:#aaa}
.footer a{color:#4f46e5;text-decoration:none}
@media (max-width:600px){
  .container{padding:24px 16px}
  .header h1{font-size:22px}
  .result-table th,.result-table td{padding:8px 10px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📦 Electron 兼容 JS 库查询</h1>
    <p id="subtitle">以下 npm 包已在鸿蒙 PC 的 Electron 34 上验证通过，可直接使用</p>
    <div class="disclaimer">⚠️ 兼容性验证由 AI 自动完成，可能存在部分与实际不符的情况。如发现错误，欢迎 <a id="issueLink" href="#" target="_blank">提交 Issue</a> 反馈。</div>
  </div>
  <div class="stats-bar" id="statsBar"><div class="stat-card"><div class="num">-</div><div class="label">加载中</div></div></div>
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="输入 npm 包名，如 lodash、@electron/remote、ws..." autocomplete="off">
    <span class="loading" id="loading">加载中...</span>
  </div>
  <div class="result-info" id="resultInfo"></div>
  <table class="result-table" id="resultTable">
    <thead><tr><th style="width:55%">包名</th><th style="width:25%">版本</th><th style="width:20%">状态</th></tr></thead>
    <tbody id="resultBody"></tbody>
  </table>
  <div class="pagination" id="pagination" style="display:none">
    <button id="prevPage" onclick="changePage(-1)">上一页</button>
    <span class="page-info" id="pageInfo"></span>
    <button id="nextPage" onclick="changePage(1)">下一页</button>
  </div>
  <div class="footer">数据来源：<a id="repoLink" href="#" target="_blank"></a><span id="lastUpdated"></span></div>
</div>
<script>
var DATA_DIR = 'data';
var CACHE_BUST = '?v=' + Date.now();
var indexData = null;
var fileCache = {};
var searchTimer = null;
var currentPage = 1;
var pageSize = 100;
var currentData = [];
var currentInfo = '';

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function displayData(data, infoText) {
  currentData = data;
  currentInfo = infoText;
  currentPage = 1;
  renderPage();
}

function renderPage() {
  var data = currentData;
  var tbody = document.getElementById('resultBody');
  var info = document.getElementById('resultInfo');
  var pagination = document.getElementById('pagination');

  if (!data.length) {
    tbody.innerHTML = '';
    info.textContent = currentInfo || '无数据';
    pagination.style.display = 'none';
    return;
  }

  var totalPages = Math.ceil(data.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  var start = (currentPage - 1) * pageSize;
  var end = Math.min(start + pageSize, data.length);
  var disp = data.slice(start, end);

  var html = '';
  for (var i = 0; i < disp.length; i++) {
    var p = disp[i];
    var npmUrl = 'https://www.npmjs.com/package/' + p.name;
    html += '<tr><td class="pkg-name"><a href="' + esc(npmUrl) + '" target="_blank" rel="noopener">' + esc(p.name) + '</a></td>';
    html += '<td class="pkg-version">' + esc(p.version || '—') + '</td>';
    html += '<td><span class="badge">✅ 兼容</span></td></tr>';
  }
  tbody.innerHTML = html;
  info.textContent = currentInfo + '（第 ' + currentPage + '/' + totalPages + ' 页，当前 ' + disp.length + ' 条，共 ' + data.length + ' 条）';

  pagination.style.display = totalPages > 1 ? 'flex' : 'none';
  document.getElementById('prevPage').disabled = (currentPage <= 1);
  document.getElementById('nextPage').disabled = (currentPage >= totalPages);
  document.getElementById('pageInfo').textContent = currentPage + ' / ' + totalPages;
}

function changePage(delta) {
  currentPage += delta;
  renderPage();
  window.scrollTo(0, 0);
}

async function loadFile(fileName) {
  if (fileCache[fileName]) return fileCache[fileName];
  try {
    var resp = await fetch(DATA_DIR + '/' + fileName + CACHE_BUST);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var text = await resp.text();
    var lines = text.trim().split('\n');
    var data = [];
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].trim()) {
        try {
          data.push(JSON.parse(lines[i]));
        } catch(e) {}
      }
    }
    fileCache[fileName] = data;
    return data;
  } catch(e) {
    console.error('Failed to load:', fileName, e);
    return [];
  }
}

// 数据量小，搜索时加载全部文件，按包名子串匹配（含 scoped 包的 / 后部分）
async function loadAll() {
  var names = Object.keys(indexData.files);
  var parts = await Promise.all(names.map(loadFile));
  return [].concat.apply([], parts);
}

async function showAll() {
  document.getElementById('loading').classList.add('show');
  var data = await loadAll();
  document.getElementById('loading').classList.remove('show');
  displayData(data, '全部兼容包');
}

async function doSearch(query) {
  query = query.trim();

  if (query.length === 0) {
    await showAll();
    return;
  }

  document.getElementById('loading').classList.add('show');
  var data = await loadAll();
  document.getElementById('loading').classList.remove('show');

  var q = query.toLowerCase();
  var exact = [], prefix = [], other = [];
  for (var i = 0; i < data.length; i++) {
    var name = data[i].name.toLowerCase();
    var bare = name.charAt(0) === '@' ? name.slice(name.indexOf('/') + 1) : name;
    if (name === q || bare === q) exact.push(data[i]);
    else if (name.indexOf(q) === 0 || bare.indexOf(q) === 0) prefix.push(data[i]);
    else if (name.indexOf(q) !== -1) other.push(data[i]);
  }
  var results = exact.concat(prefix, other);

  if (results.length === 0) {
    displayData([], '未找到 "' + query + '" 的匹配结果');
    return;
  }

  displayData(results, '搜索 "' + query + '" 找到 ' + results.length + ' 个结果');
}

function renderStats() {
  var t = indexData.total;
  document.getElementById('statsBar').innerHTML =
    '<div class="stat-card"><div class="num">' + t.toLocaleString() + '</div><div class="label">兼容包总数</div></div>' +
    '<div class="stat-card"><div class="num">' + esc(indexData.electron_version) + '</div><div class="label">Electron 版本</div></div>' +
    '<div class="stat-card"><div class="num">' + esc(indexData.last_updated) + '</div><div class="label">最后更新</div></div>';
}

function renderLinks() {
  var repoUrl = 'https://github.com/' + indexData.repo;
  var repoLink = document.getElementById('repoLink');
  repoLink.href = repoUrl;
  repoLink.textContent = indexData.repo;
  document.getElementById('issueLink').href = repoUrl + '/issues';
  document.getElementById('subtitle').textContent =
    '以下 npm 包已在鸿蒙 PC 的 Electron ' + indexData.electron_version + ' 上验证通过，可直接使用';
  document.getElementById('lastUpdated').textContent = ' · 更新日期：' + indexData.last_updated;
}

async function loadIndex() {
  try {
    var resp = await fetch(DATA_DIR + '/index.json' + CACHE_BUST);
    indexData = await resp.json();
    renderStats();
    renderLinks();
    await showAll();
  } catch(e) {
    console.error('Failed to load index:', e);
    document.getElementById('resultInfo').textContent = '加载数据失败';
  }
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    doSearch(e.target.value);
  }, 200);
});

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(searchTimer);
    doSearch(e.target.value);
  }
});

loadIndex();
</script>
</body>
</html>
